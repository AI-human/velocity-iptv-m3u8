<style>
body {
    background: #ffffff;
    color: #222;
}

/* PLAYER */
.player-wrapper {
    width: 100%;
    max-width: 85vw;
    margin: 0 auto 15px auto;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

/* Clappr Container Target */
#clapprPlayer {
    width: 100%;
    height: auto;
    display: block;
    aspect-ratio: 16/9;
}

/* Force Clappr internal video to follow aspect ratio */
#clapprPlayer [data-player] {
    height: 100% !important;
}

/* MOBILE STICKY */
@media (max-width: 768px) {
    .player-wrapper {
        max-width: 95vw;
        border-radius: 12px !important;
        position: sticky;
        top: 0;
        z-index: 1100;
    }
}
@media (min-width: 2800px) and (max-width: 2900px) {
    .player-wrapper {
        max-width: 70vw !important;
    }
}
/* CATEGORY */
.category-bar {
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin:10px 0;
}
.cat-item {
    padding:6px 12px;
    border-radius:20px;
    background:#f1f3f5;
    cursor:pointer;
}
.cat-item.active {
    background:red;
    color:#fff;
}

/* CHANNEL */
.channel-card {
    border-radius:10px;
    padding:8px;
    background:#fff;
    border:1px solid #eee;
    cursor:pointer;
}
.channel-card img {
    width:100%;
    height:60px;
    object-fit:contain;
}

/* ACTIVE CHANNEL */
.channel-card.active {
    border:2px solid red;
}

/* MOBILE GRID */
@media(max-width:768px){
    #channelList {
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }
}

/* DESKTOP SCROLL */
@media(min-width:769px){
    #channelList {
        display:flex;
        overflow-x:auto;
        gap:10px;
    }
    #channelList > div {
        min-width:120px;
    }
}

.fullscreen-btn {
    position:absolute;
    top:10px;
    right:10px;
    z-index:10;
}

.android-download-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: linear-gradient(135deg, #007bff, #0056b3); 
    color: white;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    text-align: center;
    
    box-shadow: 0 10px 20px rgba(0, 123, 255, 0.4);
    z-index: 99999;
    text-decoration: none;
    font-size: 22px;
    
    animation: pulse-blue 2s infinite;
    transition: all 0.3s ease;
}

@keyframes pulse-blue {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.7);
    }
    70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 15px rgba(0, 123, 255, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 123, 255, 0);
    }
}

.android-download-btn:hover {
    background: #004494;
    transform: translateY(-5px);
}

/* FAKE FULLSCREEN / FALLBACK */
body.is-landscape {
    overflow: hidden;
}

body.is-landscape .player-wrapper {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999999; 
    background: #000;
}

body.is-landscape #clapprPlayer {
    width: 100%;
    height: 100%;
}
.player-wrapper {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
}

.yt-controls {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    transition: opacity .25s ease;
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent 40%, rgba(0,0,0,.4));
    pointer-events: auto;
}

.yt-controls.show {
    opacity: 1;
}

.top-bar {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.live-badge {
    background: red;
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 700;
}

.channel-title {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
}

.center-controls {
    display: flex;
    justify-content: center;
    align-items: center;
}

.big-play-btn {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 32px;
}

.bottom-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
}

.left-controls,
.right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.ctrl-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 16px;
    backdrop-filter: blur(10px);
}

#volumeSlider {
    width: 80px;
}

.video-title {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.video-loader {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 30;
    pointer-events: none;
}

.video-loader.show {
    display: flex;
}

.loader-spinner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.2);
    border-top-color: #fff;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media(max-width:768px){
    .bottom-controls {
        padding: 12px;
    }
    .big-play-btn {
        width: 64px;
        height: 64px;
        font-size: 24px;
    }
    #volumeSlider {
        display: none;
    }
    .video-title {
        max-width: 100px;
    }
}
</style><style class="darkreader darkreader--sync" media="screen"></style>

url":"https://hd.ctghub.com/ZEE.CAFE.HD/index.m3u8?token=800d0f4463b116f3f4e672d31c42651396363c4a-198b26e406fb56fda057cc433657154a-1781187073-1781176273&remote=no_check_ip"}];
    const firstStream = "https:\/\/hd.ctghub.com\/A.SPORTS.HD\/index.m3u8?token=07cee305203ed9a9e1b42548214573d5e52296e5-94957fadf97b80f507aa61a7a2fa2eac-1781187073-1781176273&remote=no_check_ip";
    const playerWrapper = document.querySelector('.player-wrapper');

    let player = null;
    let controlsTimeout = null;

    // ================= CREATE CONTROLS =================
    const controls = document.createElement('div');
    controls.className = 'yt-controls';
    controls.innerHTML = `
        <div class="top-bar">
            <div class="live-badge">LIVE</div>
            <div class="channel-title">Ajob TV</div>
        </div>
        <div class="center-controls">
            <button class="big-play-btn" id="bigPlayBtn">
                <i class="fas fa-play"></i>
            </button>
        </div>
        <div class="bottom-controls">
            <div class="left-controls">
                <button class="ctrl-btn" id="playBtn">
                    <i class="fas fa-play"></i>
                </button>
                <button class="ctrl-btn" id="muteBtn">
                    <i class="fas fa-volume-up"></i>
                </button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                <div class="video-title" id="videoTitle">Live TV</div>
            </div>
            <div class="right-controls">
                <button class="ctrl-btn" id="fullscreenBtn">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>
    `;
    playerWrapper.appendChild(controls);

    // ================= LOADING =================
    const loader = document.createElement('div');
    loader.className = 'video-loader';
    loader.innerHTML = '<div class="loader-spinner"></div>';
    playerWrapper.appendChild(loader);

    function showLoader() { loader.classList.add('show'); }
    function hideLoader() { loader.classList.remove('show'); }

    function showControls() {
        controls.classList.add('show');
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(() => {
            if (player && typeof player.isPlaying === 'function' && player.isPlaying()) {
                controls.classList.remove('show');
            }
        }, 3000);
    }

    function updatePlayIcon() {
        const isPaused = (player && typeof player.isPlaying === 'function') ? !player.isPlaying() : true;
        const icon = isPaused ? 'fa-play' : 'fa-pause';
        document.querySelector('#playBtn i').className = 'fas ' + icon;
        document.querySelector('#bigPlayBtn i').className = 'fas ' + icon;
    }

    function updateMuteIcon() {
        if (!player || typeof player.getVolume !== 'function') return;
        // ভলিউম চেক করে আইকন পরিবর্তন
        const currentVol = player.getVolume();
        const icon = (currentVol === 0) ? 'fa-volume-xmark' : 'fa-volume-up';
        document.querySelector('#muteBtn i').className = 'fas ' + icon;
    }

    // ================= LOAD STREAM WITH CLAPPR =================
    function loadStream(url, title = 'Live TV', userClicked = false) {
        if (!url) return;

        if (typeof Clappr === 'undefined') {
            setTimeout(() => { loadStream(url, title, userClicked); }, 1000);
            return;
        }

        document.getElementById('videoTitle').textContent = title;
        showLoader();

        if (player) {
            try { player.destroy(); } catch(e) {}
        }

        // ব্রাউজার পলিসির জন্য ইনিশিয়াল লোডে মিউট ট্রাই করতে পারে, কিন্তু ইউজার ক্লিক করলে নয়
        const shouldMuteInitially = !userClicked; 

        player = new Clappr.Player({
            source: url,
            parentId: "#clapprPlayer",
            width: '100%',
            height: '100%',
            autoPlay: true,
            mute: shouldMuteInitially, 
            chromecast: false,
            chromeless: true, 
            hlsMinimumDvrSize: 60,
            playback: {
                playInline: true,
                hlsjsConfig: {
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30,
                    maxBufferLength: 10,
                    maxMaxBufferLength: 20
                }
            },
            events: {
                onReady: function() {
                    if (userClicked) {
                        player.unmute();
                        player.setVolume(100);
                        document.getElementById('volumeSlider').value = 1;
                    } else {
                        // ফার্স্ট টাইম অটো-প্লে রুলস হ্যান্ডেল করতে ১.৫ সেকেন্ড পর আনমিউট করার চেষ্টা করবে
                        setTimeout(() => {
                            try {
                                player.unmute();
                                player.setVolume(100);
                                document.getElementById('volumeSlider').value = 1;
                                updateMuteIcon();
                            } catch(err) {}
                        }, 1500);
                    }
                    updateMuteIcon();
                },
                onPlay: function() { hideLoader(); updatePlayIcon(); updateMuteIcon(); },
                onPause: function() { updatePlayIcon(); },
                onStop: function() { updatePlayIcon(); },
                onBuffer: function() { showLoader(); },
                onBufferFull: function() { hideLoader(); },
                onError: function(e) { console.log('Clappr/HLS Error: ', e); hideLoader(); }
            }
        });
    }

    // ================= INTERFACE CONTROLS TO CLAPPR BINDING =================
    document.getElementById('playBtn').addEventListener('click', function(){
        if (!player || typeof player.isPlaying !== 'function') return;
        if (player.isPlaying()) { player.pause(); } else { player.play(); }
    });

    document.getElementById('bigPlayBtn').addEventListener('click', function(){
        if (!player || typeof player.isPlaying !== 'function') return;
        if (player.isPlaying()) { player.pause(); } else { player.play(); }
    });

    document.getElementById('volumeSlider').addEventListener('input', function(){
        if (!player || typeof player.setVolume !== 'function') return;
        player.setVolume(this.value * 100);
        updateMuteIcon();
    });

    document.getElementById('muteBtn').addEventListener('click', function(){
        if (!player || typeof player.getVolume !== 'function' || typeof player.setVolume !== 'function') return;
        if (player.getVolume() === 0) {
            player.setVolume(100);
            document.getElementById('volumeSlider').value = 1;
        } else {
            player.setVolume(0);
            document.getElementById('volumeSlider').value = 0;
        }
        updateMuteIcon();
    });

    // ================= FORCE LANDSCAPE FULLSCREEN =================
// ================= FORCE LANDSCAPE FULLSCREEN & ICON TOGGLE =================
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // ফুলস্ক্রিন স্ট্যাটাস অনুযায়ী আইকন পরিবর্তন করার ফাংশন
    function toggleFullscreenIcon() {
        const icon = document.querySelector('#fullscreenBtn i');
        const isFS = document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement ||
                     document.msFullscreenElement;
                     
        if (isFS) {
            icon.className = 'fas fa-compress';
        } else {
            icon.className = 'fas fa-expand';
        }
    }

    fullscreenBtn.addEventListener('click', function(){
        const isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        // ১. আইফোন/iOS এর জন্য ১০০০% ওয়ার্কিং ফিক্স
        if (isiPhone) {
            // Clappr এর ভেতরের নেটিভ HTML5 ভিডিও ট্যাগটি খুঁজে বের করা হচ্ছে
            const nativeVideo = playerWrapper.querySelector('video');
            if (nativeVideo) {
                if (document.webkitFullscreenElement) {
                    if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                } else {
                    // আইফোনে নেটিভ ভিডিও ফুলস্ক্রিন ট্রিগার (এটি অটোমেটিক ল্যান্ডস্কেপ হ্যান্ডেল করে)
                    if (nativeVideo.webkitEnterFullscreen) {
                        nativeVideo.webkitEnterFullscreen();
                    } else if (nativeVideo.requestFullscreen) {
                        nativeVideo.requestFullscreen();
                    } else if (nativeVideo.webkitRequestFullscreen) {
                        nativeVideo.webkitRequestFullscreen();
                    }
                }
            }
            setTimeout(toggleFullscreenIcon, 500);
            return;
        }

        // ২. এন্ড্রয়েড এবং অন্যান্য ডিভাইসের জন্য স্ট্যান্ডার্ড ফুলস্ক্রিন
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const requestFS = playerWrapper.requestFullscreen || 
                              playerWrapper.webkitRequestFullscreen || 
                              playerWrapper.mozRequestFullScreen || 
                              playerWrapper.msRequestFullscreen;
            
            if (requestFS) {
                requestFS.call(playerWrapper).then(() => {
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(function(err) {
                            console.log("Orientation lock auto-rejected:", err);
                        });
                    }
                }).catch(() => {
                    document.body.classList.add('is-landscape');
                    toggleFullscreenIcon();
                });
            }
        } else {
            const exitFS = document.exitFullscreen || 
                           document.webkitExitFullscreen || 
                           document.mozCancelFullScreen || 
                           document.msExitFullscreen;
            if (exitFS) {
                exitFS.call(document).catch(() => {});
            }
            if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                screen.orientation.unlock();
            }
            document.body.classList.remove('is-landscape');
        }
    });

    // গ্লোবাল লিসেনার: যেকোনো উপায়ে (সোয়াইপ, সিস্টেম ব্যাক বাটন বা ক্লোজ বাটন) ফুলস্ক্রিন চেঞ্জ হলে আইকন এবং ক্লাস সিঙ্ক হবে
    const fsEvents = [
        'fullscreenchange', 
        'webkitfullscreenchange', 
        'mozfullscreenchange', 
        'MSFullscreenChange'
    ];
    
    fsEvents.forEach(eventName => {
        document.addEventListener(eventName, function() {
            toggleFullscreenIcon();
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFS) {
                document.body.classList.remove('is-landscape');
                if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                    screen.orientation.unlock();
                }
            }
        });
    });

    // আইফোনের নেটিভ ভিডিও প্লেয়ারের এক্সিট ট্র্যাকিং এর জন্য অতিরিক্ত সেফটি লিসেনার
    playerWrapper.addEventListener('webkitendfullscreen', function() {
        const icon = document.querySelector('#fullscreenBtn i');
        if (icon) icon.className = 'fas fa-expand';
        document.body.classList.remove('is-landscape');
    });

    // ফুলস্ক্রিন থেকে ব্যাক বা এক্সিট বাটন চাপলে ক্লাসের স্টেট রিমুভ করার লিসেনার
    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement) {
            document.body.classList.remove('is-landscape');
            if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                screen.orientation.unlock();
            }
        }
    });

    playerWrapper.addEventListener('mousemove', showControls);
    playerWrapper.addEventListener('touchstart', showControls);

    // ================= INIT & CHANNELS RENDER =================
    function renderChannels(list) {
        const container = document.getElementById('channelList');
        container.innerHTML = '';

        list.forEach(function(ch){
            const wrapper = document.createElement('div');
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.dataset.url = ch.play_url;
            card.dataset.name = ch.name || 'Live TV';
            card.innerHTML = `<img src="/assets/images/channels/${ch.logo}">`;

            card.addEventListener('click', function(){
                document.querySelectorAll('.channel-card').forEach(function(c){
                    c.classList.remove('active');
                });
                this.classList.add('active');
                // ইউজার ক্লিক করে চ্যানেল চেঞ্জ করলে সাউন্ড ডিরেক্ট অন হবে
                loadStream(this.dataset.url, this.dataset.name, true);
            });

            wrapper.appendChild(card);
            container.appendChild(wrapper);
        });
    }

    window.filterCat = function(cat, btn) {
        document.querySelectorAll('.cat-item').forEach(function(item){
            item.classList.remove('active');
        });
        btn.classList.add('active');

        const filtered = (cat === 'all')
            ? channels
            : channels.filter(function(ch){
                return (ch.category_name || '').toLowerCase() === cat.toLowerCase();
            });

        renderChannels(filtered);
    }

    // Initial Load (প্রথমবার লোড হওয়ার সময় ইউজার ট্রিলিং ফলস থাকবে)
    if (firstStream) {
        loadStream(firstStream, 'Live TV', false);
    }

    showControls();
    renderChannels(channels);
});
